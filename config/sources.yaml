# =============================================================================
# sources.yaml
# Lists every source table the pipeline loads. The notebooks read this list
# instead of having table names written into the code, so adding a new table
# means adding it here.
# scripts/06_upload_config.py copies this file to the lakehouse as JSON
# (lh_bronze/Files/config/sources.json), which is what the notebooks read.
# The column types are what each table must look like in Silver.
#
# Each source has an "ingestion" block saying how it reaches Bronze
# (see docs/adr/ADR-003-ingestion-tools.md):
#   method          copy_job | notebook_api | dataflow | shortcut
#   lands_in        files        = arrives under lh_bronze/Files/landing, then
#                                  nb_10 loads it into Bronze tables
#                   bronze_table = the tool writes the Bronze table itself
#   change_column   how Silver finds new rows. Default _load_date.
#                   null = small table, Silver re-reads all of it every run.
#   bronze_schema   Bronze schema name, if it isn't the same as the system name.
#
# system: the source system a source belongs to. It names the Bronze and Silver
# schemas and the table keys (tessitura.order_line). Several sources can share
# one system when the system hands its data over in more than one way.
# Defaults to the source name.
#
# Personal data is tagged per table, at two levels:
#   pii         columns that identify a person (names, emails, addresses).
#               Labelled, but people who need named records can still see them.
#   restricted  the PII that lets you contact or locate someone (email, phone,
#               street address). Hidden from every OneLake security role and
#               masked in dq.quarantine. validate_config.py checks both.
# Your own values (servers, storage account, SharePoint site, connection IDs) are
# not written here, because this file is on GitHub. Each one is a ${NAME} that the
# scripts fill in from .env (ignored by Git). Copy .env.example to .env to start.
# =============================================================================

sources:
  # ---------------------------------------------------------------------------
  # Tessitura (the ticketing, CRM and fundraising system), mocked in two parts,
  # the way Tessitura really exposes its data:
  #   tessitura_db   its SQL Server database, kept on-premises. A Fabric Copy job
  #                  reads it through the on-premises data gateway, copies only the
  #                  rows changed since its last run (by updated_at) and appends
  #                  them to lh_bronze.tessitura.<table>.
  #                  scripts/11_load_tessitura_db.py creates the tables and loads the data.
  #   tessitura_api  its REST API, used for contributions (a mock on GitHub Pages).
  #                  nb_05_tessitura_api follows the pages and saves the records to
  #                  Files/landing/tessitura_api; nb_10 then loads them into Bronze.
  # Both share system: tessitura, so they land in the same Bronze and Silver schema.
  # Donors are constituents like ticket buyers, so contributions carry a
  # constituent_id. Some people have two constituent records (for example after
  # giving online without signing in); Silver merges those into one patron.
  # ---------------------------------------------------------------------------
  - source: tessitura_db
    system: tessitura
    owner: "Ticketing & Patron Services"
    ingestion:
      method: copy_job
      lands_in: bronze_table
      change_column: updated_at
      source_db:
        server: "${TESSITURA_SQL_SERVER}"
        database: "${TESSITURA_SQL_DATABASE}"
        schema: tix
    entities:
      - name: constituent
        primary_key: [constituent_id]
        order_by: updated_at
        pii: [first_name, last_name, email, phone, address_line1]
        restricted: [email, phone, address_line1]
        columns:
          constituent_id: string
          first_name: string
          last_name: string
          email: string
          phone: string
          address_line1: string
          city: string
          state: string
          postal_code: string
          country: string
          constituent_type: string
          email_opt_in: boolean
          created_at: timestamp
          updated_at: timestamp
      - name: season
        primary_key: [season_id]
        order_by: season_id
        columns: { season_id: string, season_name: string, fiscal_year: int, start_date: date, end_date: date }
      - name: venue
        primary_key: [venue_id]
        order_by: venue_id
        columns: { venue_id: string, venue_name: string, capacity: int }
      - name: performance
        primary_key: [performance_id]
        order_by: updated_at
        columns:
          performance_id: string
          season_id: string
          venue_id: string
          title: string
          series: string
          genre: string
          performance_datetime: timestamp
          capacity: int
          status: string
          updated_at: timestamp
      - name: order
        primary_key: [order_id]
        order_by: updated_at
        columns:
          order_id: string
          constituent_id: string
          order_datetime: timestamp
          channel: string
          status: string
          updated_at: timestamp
      - name: order_line
        primary_key: [order_line_id]
        order_by: updated_at
        columns:
          order_line_id: string
          order_id: string
          performance_id: string
          price_zone: string
          quantity: int
          unit_price: "decimal(12,2)"
          discount_amount: "decimal(12,2)"
          is_comp: boolean
          updated_at: timestamp
      - name: subscription
        primary_key: [subscription_id]
        order_by: purchased_at
        columns:
          subscription_id: string
          constituent_id: string
          season_id: string
          package_name: string
          seats: int
          package_amount: "decimal(12,2)"
          is_renewal: boolean
          purchased_at: timestamp

  - source: tessitura_api
    system: tessitura
    format: json
    owner: "Development (Fundraising)"
    ingestion:
      method: notebook_api
      lands_in: files
      api_base_url: "${TESSITURA_API_BASE_URL}"
    entities:
      - name: campaign
        primary_key: [campaign_id]
        order_by: campaign_id
        columns: { campaign_id: string, campaign_name: string, campaign_type: string, fiscal_year: int, goal_amount: "decimal(14,2)" }
      - name: fund
        primary_key: [fund_id]
        order_by: fund_id
        columns: { fund_id: string, fund_name: string, is_restricted: boolean }
      - name: contribution
        primary_key: [contribution_id]
        order_by: updated_at
        columns:
          contribution_id: string
          constituent_id: string
          contribution_date: date
          amount: "decimal(14,2)"
          contribution_type: string
          campaign_id: string
          fund_id: string
          is_anonymous: boolean
          updated_at: timestamp

  # ---------------------------------------------------------------------------
  # Education programs. Excel workbooks kept by the program team in SharePoint.
  # A Dataflow Gen2 reads the folder and replaces lh_bronze.dbo.<table>
  # on every run (see src/ingestion/dataflow_education.md).
  # Only participant counts are kept. There is no data about individual students.
  # ---------------------------------------------------------------------------
  - source: education
    owner: "Education & Community Programs"
    ingestion:
      method: dataflow
      lands_in: bronze_table
      change_column: null
      bronze_schema: dbo        # Dataflow Gen2 can't pick a lakehouse schema yet, so it writes to dbo
      sharepoint_site: "${EDUCATION_SHAREPOINT_SITE}"
    entities:
      - name: programs
        primary_key: [program_id]
        order_by: program_id
        columns: { program_id: string, program_name: string, program_type: string, audience: string }
      - name: schools
        primary_key: [school_id]
        order_by: school_id
        columns: { school_id: string, school_name: string, borough: string, is_title_i: boolean }
      - name: enrollments
        primary_key: [enrollment_id]
        order_by: session_date
        columns:
          enrollment_id: string
          program_id: string
          school_id: string
          session_date: date
          participants: int
          teaching_artist_hours: "decimal(6,1)"

  # ---------------------------------------------------------------------------
  # Marketing. Daily exports from the email platform and the ad platforms,
  # dropped into an ADLS Gen2 container. A OneLake shortcut
  # (lh_bronze/Files/landing/marketing) shows them in Fabric without copying;
  # nb_10 then loads them into Bronze. Created by scripts/10_create_shortcuts.py.
  # ---------------------------------------------------------------------------
  - source: marketing
    format: csv
    owner: "Marketing & Communications"
    ingestion:
      method: shortcut
      lands_in: files
      adls:
        account_url: "${MARKETING_ADLS_ACCOUNT_URL}"
        container: marketing-exports
        connection_id: "${MARKETING_ADLS_CONNECTION_ID}"   # Fabric connection to the storage account
    entities:
      - name: email_campaigns
        primary_key: [email_campaign_id]
        order_by: updated_at        # stats keep changing for a week after the send
        columns:
          email_campaign_id: string
          campaign_name: string
          campaign_type: string
          series_promoted: string
          audience_segment: string
          send_datetime: timestamp
          recipients: int
          delivered: int
          bounces: int
          unique_opens: int
          unique_clicks: int
          unsubscribes: int
          updated_at: timestamp
      - name: email_clicks
        primary_key: [click_id]
        order_by: clicked_at
        pii: [email]
        restricted: [email]
        columns:
          click_id: string
          email_campaign_id: string
          email: string
          clicked_at: timestamp
          link_url: string
      - name: ad_spend_daily
        primary_key: [ad_date, ad_campaign_id]
        order_by: updated_at        # platforms restate the last two days
        columns:
          ad_date: date
          platform: string
          ad_campaign_id: string
          ad_campaign_name: string
          utm_campaign: string
          series_promoted: string
          impressions: int
          clicks: int
          spend: "decimal(12,2)"
          currency: string
          updated_at: timestamp
