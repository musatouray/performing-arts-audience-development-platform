# =============================================================================
# tenant.yaml — SINGLE SOURCE OF TRUTH for the Fabric tenant topology.
# Every provisioning script in /scripts reads this file. Change the design here,
# re-run the scripts (they are idempotent: "create if missing, else reuse").
# =============================================================================

org:
  code: hh                       # short prefix used in every name (lower-case)
  name: Harmonia Hall            # fictional stand-in for a NYC performing-arts nonprofit
  fiscal_year_start_month: 7     # US nonprofit FY runs Jul -> Jun

# Fabric capacity. Trial = F64-equivalent. Leave capacity_id empty and the
# script picks the first capacity you can assign (your trial).
capacity:
  # Precedence: capacity_id (exact, safest) > region (+ optional display_name_hint).
  # The script stops if zero or several capacities match - it never guesses.
  # List yours: uv run python scripts/list_capacities.py
  capacity_id: ""
  region: "East US 2"
  display_name_hint: ""

# Git (GitHub). Only DEV workspaces are Git-connected; Test/Prod are promoted
# by deployment pipelines (see docs/adr/ADR-005-cicd.md).
git:
  provider: GitHub
  owner: musatouray
  repository: performing-arts-audience-development-platform
  branch: main
  # Fabric "Connection" (Settings > Manage connections > GitHub - Source control)
  # holding a fine-grained PAT. Paste its ID here after creating it in the UI.
  connection_id: ""

# -----------------------------------------------------------------------------
# Security groups (Microsoft Entra). Principle: assign GROUPS, never people.
# scripts/00_create_security_groups.py creates any that are missing.
# -----------------------------------------------------------------------------
security_groups:
  fabric_admins:        { name: "sg-hh-fabric-admins",        purpose: "Platform owners. Workspace Admin everywhere." }
  data_engineers:       { name: "sg-hh-data-engineers",       purpose: "Build pipelines/notebooks/warehouse. Contributor in DE Dev/Test." }
  bi_developers:        { name: "sg-hh-bi-developers",        purpose: "Build semantic models and reports. Contributor in BI Dev/Test." }
  analysts_audience:    { name: "sg-hh-analysts-audience",    purpose: "Ticketing/marketing analysts. Build on certified Audience model." }
  analysts_development: { name: "sg-hh-analysts-development", purpose: "Fundraising analysts. Donor data incl. giving history." }
  education_team:       { name: "sg-hh-education-team",       purpose: "Education program staff. Education data only." }
  report_viewers:       { name: "sg-hh-report-viewers",       purpose: "All staff consuming published apps." }

# -----------------------------------------------------------------------------
# Domains (data mesh-lite). One parent domain for the org, subdomains by
# business area. Domain = governance + discoverability boundary, NOT security:
# domain roles grant NO access to workspaces or data (workspace roles do that,
# see workspace_families.roles below).
#   * Domain admins are set on the PARENT only - subdomains inherit them
#     (Fabric: "a subdomain's domain admins are the domain admins of its parent").
#   * Domain contributors = workspace ADMINS allowed to self-assign their
#     workspaces to the domain. 
# -----------------------------------------------------------------------------
domains:
  - key: org
    name: "Harmonia Hall"
    description: "Enterprise domain for all Harmonia Hall analytics."
    admins: [fabric_admins]          # inherited by all subdomains
  - key: platform
    parent: org
    name: "Data Platform"
    description: "Shared ingestion, lakehouse and warehouse layers (Bronze/Silver/Gold)."
  - key: audience
    parent: org
    name: "Audience & Development"
    description: "Ticketing, subscriptions, patrons and fundraising analytics."
  - key: education
    parent: org
    name: "Education & Community"
    description: "Music education and social-impact program analytics."

# Environments. Same item NAMES in every environment -> notebooks/SQL resolve
# items by name at runtime, so promotion needs no ID rebinding.
environments: [dev, test, prod]

# -----------------------------------------------------------------------------
# Workspace "families". One workspace per family per environment.
# Name pattern: {org}-{family}-{env}   e.g. hh-dataplatform-dev
# -----------------------------------------------------------------------------
workspace_families:
  - key: dataplatform
    display: "Data Platform"
    domain: platform
    git_directory: fabric/de           # folder in the repo the DEV workspace syncs to
    items:
      lakehouses:
        - { name: lh_bronze, schemas: true, description: "Raw, immutable, append-only landing + Delta copies of source extracts." }
        - { name: lh_silver, schemas: true, description: "Cleaned, conformed, de-duplicated, typed. Identity-resolved patrons. DQ results." }
      warehouses:
        - { name: wh_gold,   description: "Star schema (dims/facts) + security. The only layer business users touch (via semantic models)." }
    roles:
      dev:  { fabric_admins: Admin, data_engineers: Contributor }
      test: { fabric_admins: Admin, data_engineers: Contributor }
      prod: { fabric_admins: Admin, data_engineers: Viewer }   # nobody hand-edits PROD

  - key: audience
    display: "Audience & Development BI"
    domain: audience
    git_directory: fabric/bi-audience
    items: {}                           # semantic models/reports are built in the UI then synced by Git
    roles:
      dev:  { fabric_admins: Admin, bi_developers: Contributor }
      test: { fabric_admins: Admin, bi_developers: Contributor, analysts_audience: Viewer, analysts_development: Viewer }
      prod: { fabric_admins: Admin, bi_developers: Viewer }     # consumers get the App, not the workspace

  - key: education
    display: "Education & Community BI"
    domain: education
    git_directory: fabric/bi-education
    items: {}
    roles:
      dev:  { fabric_admins: Admin, bi_developers: Contributor }
      test: { fabric_admins: Admin, bi_developers: Contributor, education_team: Viewer }
      prod: { fabric_admins: Admin, bi_developers: Viewer }

# One deployment pipeline per workspace family (Fabric requires 1 workspace per stage).
deployment_pipelines:
  stages:
    - { env: dev,  name: "Development", public: false }
    - { env: test, name: "Test",        public: false }
    - { env: prod, name: "Production",  public: true  }
  admins: [fabric_admins]

# -----------------------------------------------------------------------------
# Item-level shares (least privilege ACROSS workspace families).
# BI developers get Gold only - never a Data Platform workspace role, which would
# expose Bronze/Silver. Warehouse sharing is UI-only today (no public API), so
# scripts/09_verify_item_shares.py prints the steps and VERIFIES them via the
# Admin API. Report viewers need nothing here: models use a fixed identity.
#   Read     = connect (always part of a share)
#   ReadData = query all tables with SQL (validate numbers)
#   ReadAll  = read OneLake files -> required to author Direct Lake ON ONELAKE models
# -----------------------------------------------------------------------------
item_shares:
  - workspace_family: dataplatform
    item: wh_gold
    item_type: Warehouse
    grant_to: [bi_developers]
    permissions: [Read, ReadData, ReadAll]
    environments: [dev, test, prod]     # each env's BI model reads the SAME env's Gold

# -----------------------------------------------------------------------------
# OneLake security (lh_silver). Table-level roles; RLS/CLS via constraints.
# Applied by scripts/07_apply_onelake_security.py. Engineers use workspace roles.
# -----------------------------------------------------------------------------
onelake_security:
  lakehouse: lh_silver
  roles:
    - name: AudienceReaders
      members: [analysts_audience]
      tables: [ticketing/performances, ticketing/orders, ticketing/order_lines, ticketing/subscriptions]
    - name: DevelopmentReaders
      members: [analysts_development]
      tables: [fundraising/gifts, fundraising/campaigns, fundraising/funds, core/patron]
      # Column-level security = PERMIT list. Contact PII (email, phone, address_line1)
      # is deliberately absent, so it is hidden from fundraising analysts on the lake.
      allow_columns:
        core/patron: [patron_id, first_name, last_name, city, state, postal_code, country, patron_type, first_seen_date, source_systems]
    - name: EducationReaders
      members: [education_team]
      tables: [education/programs, education/schools, education/enrollments]
