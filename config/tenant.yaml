# =============================================================================
# tenant.yaml
# The design of the Fabric tenant: groups, domains, workspaces, pipelines and
# security. Every script in /scripts reads this file. To change the setup, edit
# it here and re-run the scripts. They skip anything that already exists.
# =============================================================================

org:
  code: hh                       # prefix used in every name
  name: Harmonia Hall            # fictional NYC performing-arts nonprofit
  fiscal_year_start_month: 7     # the fiscal year runs July to June

# Which Fabric capacity the workspaces run on.
# Set FABRIC_CAPACITY_ID in .env to pick one exactly, or leave it out and the
# region below picks it. Anything tied to your tenant (IDs, server names) goes
# in .env, never in this file, because this file is on GitHub.
# If no capacity matches, or more than one does, the script stops and lists them.
# To see your capacities: uv run python scripts/list_capacities.py
capacity:
  capacity_id: "${FABRIC_CAPACITY_ID:-}"
  region: "East US 2"
  display_name_hint: ""

# GitHub connection. Only the dev workspaces are connected to Git.
# Test and prod receive changes through deployment pipelines (see ADR-005).
git:
  provider: GitHub
  owner: musatouray
  repository: performing-arts-audience-development-platform
  branch: main
  # ID of the GitHub connection created in Fabric
  # (Settings > Manage connections and gateways). Set in .env.
  connection_id: "${FABRIC_GIT_CONNECTION_ID}"

# -----------------------------------------------------------------------------
# Security groups in Microsoft Entra.
# Permissions are always given to groups, never to individual people.
# scripts/00_create_security_groups.py creates any group that's missing.
# -----------------------------------------------------------------------------
security_groups:
  fabric_admins:        { name: "sg-hh-fabric-admins",        purpose: "Platform owners. Admin on every workspace." }
  data_engineers:       { name: "sg-hh-data-engineers",       purpose: "Build pipelines, notebooks and the warehouse." }
  bi_developers:        { name: "sg-hh-bi-developers",        purpose: "Build semantic models and reports." }
  analysts_audience:    { name: "sg-hh-analysts-audience",    purpose: "Ticketing and marketing analysts." }
  analysts_development: { name: "sg-hh-analysts-development", purpose: "Fundraising analysts. Can see donor giving history." }
  education_team:       { name: "sg-hh-education-team",       purpose: "Education program staff. Education data only." }
  report_viewers:       { name: "sg-hh-report-viewers",       purpose: "Staff who use the published report apps." }

# -----------------------------------------------------------------------------
# Domains group workspaces by business area so people can find data in the
# OneLake catalog. They don't control access; workspace roles do that.
# Domain admins are set on the parent only. Subdomains inherit them.
# -----------------------------------------------------------------------------
domains:
  - key: org
    name: "Harmonia Hall"
    description: "Enterprise domain for all Harmonia Hall analytics."
    admins: [fabric_admins]
  - key: platform
    parent: org
    name: "Data Platform"
    description: "Shared ingestion, lakehouse and warehouse layers (Bronze/Silver/Gold)."
  - key: audience
    parent: org
    name: "Audience & Development"
    description: "Ticketing, subscriptions, patrons and fundraising analytics."
  - key: education
    parent: org
    name: "Education & Community"
    description: "Music education and social-impact program analytics."

# Items have the same names in every environment, so code moves from dev to
# test to prod without any changes.
environments: [dev, test, prod]

# -----------------------------------------------------------------------------
# Workspaces. Each family gets one workspace per environment,
# named {org}-{family}-{env}, for example hh-dataplatform-dev.
# Builders can edit in dev and test. In prod they can only view, so prod only
# changes through a deployment pipeline.
# -----------------------------------------------------------------------------
workspace_families:
  - key: dataplatform
    display: "Data Platform"
    domain: platform
    git_directory: fabric/de           # repo folder the dev workspace syncs to
    items:
      lakehouses:
        - { name: lh_bronze, schemas: true, description: "Raw source data, stored as received." }
        - { name: lh_silver, schemas: true, description: "Cleaned, typed and de-duplicated data, plus data quality results." }
      warehouses:
        - { name: wh_gold,   description: "Star schema for reporting. The layer the semantic models read." }
    roles:
      dev:  { fabric_admins: Admin, data_engineers: Contributor }
      test: { fabric_admins: Admin, data_engineers: Contributor }
      prod: { fabric_admins: Admin, data_engineers: Viewer }

  - key: audience
    display: "Audience & Development BI"
    domain: audience
    git_directory: fabric/bi-audience
    items: {}                           # models and reports are built in Fabric, then saved to Git
    roles:
      dev:  { fabric_admins: Admin, bi_developers: Contributor }
      test: { fabric_admins: Admin, bi_developers: Contributor, analysts_audience: Viewer, analysts_development: Viewer }
      prod: { fabric_admins: Admin, bi_developers: Viewer }

  - key: education
    display: "Education & Community BI"
    domain: education
    git_directory: fabric/bi-education
    items: {}
    roles:
      dev:  { fabric_admins: Admin, bi_developers: Contributor }
      test: { fabric_admins: Admin, bi_developers: Contributor, education_team: Viewer }
      prod: { fabric_admins: Admin, bi_developers: Viewer }

# One deployment pipeline per workspace family.
deployment_pipelines:
  stages:
    - { env: dev,  name: "Development", public: false }
    - { env: test, name: "Test",        public: false }
    - { env: prod, name: "Production",  public: true  }
  admins: [fabric_admins]

# -----------------------------------------------------------------------------
# Item shares give access to a single item without a workspace role.
# BI developers get the Gold warehouse only, in each environment, so they never
# see Bronze or Silver. Report viewers aren't listed here: they see reports
# through the org apps in the BI prod workspaces.
# Warehouse sharing can only be done in the Fabric portal;
# scripts/09_verify_item_shares.py shows the steps and checks the result.
#   Read     = connect to the warehouse (always included)
#   ReadData = query all tables with SQL
#   ReadAll  = read the underlying files in OneLake (needed for Direct Lake models)
# -----------------------------------------------------------------------------
item_shares:
  - workspace_family: dataplatform
    item: wh_gold
    item_type: Warehouse
    grant_to: [bi_developers]
    permissions: [Read, ReadData, ReadAll]
    environments: [dev, test, prod]     # BI models read Gold from their own environment

# -----------------------------------------------------------------------------
# OneLake security on the Silver lakehouse: which group can read which tables.
# Engineers aren't listed because their workspace role already gives access.
# Applied by scripts/07_apply_onelake_security.py.
# -----------------------------------------------------------------------------
onelake_security:
  lakehouse: lh_silver
  roles:
    - name: AudienceReaders
      members: [analysts_audience]
      tables: [ticketing/performances, ticketing/orders, ticketing/order_lines, ticketing/subscriptions,
               marketing/email_campaigns, marketing/ad_spend_daily]   # not email_clicks: it holds email addresses
    - name: DevelopmentReaders
      members: [analysts_development]
      tables: [fundraising/gifts, fundraising/campaigns, fundraising/funds, core/patron]
      # Only these columns are visible. Email, phone and street address are left out.
      allow_columns:
        core/patron: [patron_id, first_name, last_name, city, state, postal_code, country, patron_type, first_seen_date, source_systems]
    - name: EducationReaders
      members: [education_team]
      tables: [education/programs, education/schools, education/enrollments]
